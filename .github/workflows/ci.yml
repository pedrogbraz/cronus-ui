# Cronus UI CI — every gate the release script runs locally, on every PR.
#
# Four parallel jobs:
#   gates   — build + lint + typecheck + unit tests + the drift gates
#             (registry / tokens / props / example-sections) + bundle budgets
#             (strict: a missing tracked route also fails).
#   browser — Playwright against the built app: the axe a11y scan over the
#             core routes and the behavioral flows.
#   visual  — Playwright screenshot regression of the component galleries.
#             Baselines are per-platform (e2e/visual/__screenshots__/<platform>);
#             until linux baselines are committed the job runs in BOOTSTRAP
#             mode: it generates them, uploads them as an artifact to be
#             promoted into the repo, and passes with a notice (see the
#             "Visual regression" section of CONTRIBUTING.md).
#
#   audit   — Cronus Audit against the kernel commit pinned in cronus-kernel.ref.
#   visual-baselines-linux — regenerates e2e/audit/__screenshots__/linux inside
#             the Playwright docker image and uploads them as an artifact.
#
# Triggers: pull_request and push to main run `gates`, `browser`, `visual` and
# `audit`. `visual-baselines-linux` stays manual (workflow_dispatch): it
# rewrites committed baselines, which is never something a PR should do.
# `npx cronus-ui add` hits raw.githubusercontent.com only after a public
# tag (release preflight). Local: `-r ./registry`.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install
        run: bun install --frozen-lockfile || bun install --frozen-lockfile
      - name: Build
        run: bun run build
      - name: Lint
        run: bun run lint
      - name: Contract check
        run: bun run contract:check
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests
        run: bun run test
      - name: Registry in sync
        run: bun run registry:check
      - name: Tokens in sync
        run: bun run tokens:check
      - name: Props tables in sync
        run: bun run props:check
      - name: Example sections in sync
        run: bun run check:example-sections
      - name: A11y route manifest in sync
        run: bun run a11y:routes:check
      - name: Bundle budgets
        env:
          BUNDLE_CHECK_STRICT: "1"
        run: bun run bundle:check
      - name: Package smoke (light)
        run: bun run package:smoke

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install
        run: bun install --frozen-lockfile || bun install --frozen-lockfile
      - name: Build
        env:
          NEXT_PUBLIC_PRO_URL: http://localhost:4748
          NEXT_PUBLIC_OSS_URL: http://localhost:4747
        run: bun run build
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - name: Accessibility scan (axe)
        run: bun run test:a11y
      - name: Per-theme contrast
        run: bun run test:contrast
      - name: Behavioral flows
        run: bun run test:e2e

  visual:
    # A PR gate: the linux baselines under e2e/visual/__screenshots__/linux are
    # committed (31 PNGs) and the job compares against them.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install
        run: bun install --frozen-lockfile || bun install --frozen-lockfile
      - name: Build showcase
        run: bunx turbo build --filter=@cronus-ui/www --filter=@cronus-ui/pro
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      # Compare when linux baselines are committed; otherwise BOOTSTRAP —
      # generate them, upload as an artifact, and pass with a notice so the
      # first run on a new platform can't fail on missing snapshots.
      - name: Visual regression (compare or bootstrap)
        id: visual
        shell: bash
        run: |
          SNAP_DIR="e2e/visual/__screenshots__/linux"
          if [ -d "$SNAP_DIR" ] && [ -n "$(ls -A "$SNAP_DIR" 2>/dev/null)" ]; then
            echo "mode=compare" >> "$GITHUB_OUTPUT"
            bunx playwright test --project=visual
          else
            echo "mode=bootstrap" >> "$GITHUB_OUTPUT"
            echo "::notice title=Visual baselines bootstrapped::No linux baselines are committed yet. This run generated a fresh set and uploaded it as the 'visual-baselines-linux' artifact. Download it and commit it under e2e/visual/__screenshots__/linux/ to arm the visual gate (see CONTRIBUTING.md → Visual regression)."
            bunx playwright test --project=visual --update-snapshots
          fi
      - name: Upload bootstrapped linux baselines
        if: steps.visual.outputs.mode == 'bootstrap'
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-linux
          path: e2e/visual/__screenshots__/linux
          if-no-files-found: error
      # On a red compare run, ship the expected/actual/diff triplets for review.
      - name: Upload visual diff report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff-report
          path: test-results
          if-no-files-found: ignore

  audit:
    # A PR gate. It was manual while geometry.spec.ts reported 10 failed / 774
    # passed on Linux against 0 failures on macOS at the same kernel SHA. The
    # cause was the Cronus canvas being a separate document: its media queries
    # read the iframe width, and the iframe sat 0.02px from the kernel's
    # `max-width: 639.98px` breakpoint, so the 10px a classic scrollbar gutter
    # costs on Linux flipped the kernel to its mobile layout while React stayed
    # desktop. The iframe now has a fixed 1152px width and the audit route no
    # longer reserves a gutter; run 35135620195 reported 784 passed, 0 failed.
    # The kernel is pinned by the SHA in cronus-kernel.ref (repo root).
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CRONUS_KERNEL_REPO: pedrogbraz/cronus-kernel
      CRONUS_AUDIT_ORIGIN: http://127.0.0.1:5176
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned kernel SHA
        id: kernel
        shell: bash
        run: |
          SHA="$(tr -d '[:space:]' < cronus-kernel.ref)"
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=cronus-kernel.ref::expected a 40-char commit SHA, got '$SHA'"
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - name: Checkout cronus-kernel at pinned SHA
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CRONUS_KERNEL_REPO }}
          ref: ${{ steps.kernel.outputs.sha }}
          path: cronus-kernel
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cronus-kernel
      - name: Install
        run: bun install --frozen-lockfile || bun install --frozen-lockfile
      - name: Build kernel
        working-directory: cronus-kernel
        run: cargo build
      - name: Build www
        run: bunx turbo build --filter=@cronus-ui/www
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - name: Cronus Audit
        id: audit
        env:
          CRONUS_BIN: ${{ github.workspace }}/cronus-kernel/target/debug/cronus
          CRONUS_KERNEL_ROOT: ${{ github.workspace }}/cronus-kernel
        shell: bash
        run: |
          SNAP_DIR="e2e/audit/__screenshots__/linux"
          if [ -d "$SNAP_DIR" ] && [ -n "$(ls -A "$SNAP_DIR" 2>/dev/null)" ]; then
            echo "mode=compare" >> "$GITHUB_OUTPUT"
            bunx playwright test -c playwright.audit.config.ts
          else
            echo "mode=bootstrap" >> "$GITHUB_OUTPUT"
            echo "::notice title=Audit baselines bootstrapped::No linux audit baselines yet. This run generated them as the 'audit-baselines-linux' artifact."
            bunx playwright test -c playwright.audit.config.ts --update-snapshots
          fi
      - name: Upload bootstrapped linux audit baselines
        if: steps.audit.outputs.mode == 'bootstrap'
        uses: actions/upload-artifact@v4
        with:
          name: audit-baselines-linux
          path: e2e/audit/__screenshots__/linux
          if-no-files-found: ignore
      - name: Upload audit report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: audit-diff-report
          path: |
            test-results
            playwright-report/audit
          if-no-files-found: ignore

  visual-baselines-linux:
    # Manual-only. Regenerates the Cronus Audit visual baselines and uploads
    # them for a later commit under e2e/audit/__screenshots__/linux.
    #
    # Runs on the plain runner, NOT in the Playwright container, on purpose.
    # A baseline is only useful to the environment that compares it, and the
    # `audit` job compares on ubuntu-latest — a container with its own font
    # and graphics stack would produce PNGs that fail the very gate they feed.
    # The container also could not work as written: the noble image ships no
    # `unzip`, so oven-sh/setup-bun@v2 failed and every later step was skipped
    # (run 35127021335). Pinning the graphics stack on BOTH sides is a
    # defensible future change; it needs an ADR and it needs `audit` to move
    # too, not just this job.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CRONUS_KERNEL_REPO: pedrogbraz/cronus-kernel
      CRONUS_AUDIT_ORIGIN: http://127.0.0.1:5176
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned kernel SHA
        id: kernel
        shell: bash
        run: |
          SHA="$(tr -d '[:space:]' < cronus-kernel.ref)"
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=cronus-kernel.ref::expected a 40-char commit SHA, got '$SHA'"
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - name: Checkout cronus-kernel at pinned SHA
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CRONUS_KERNEL_REPO }}
          ref: ${{ steps.kernel.outputs.sha }}
          path: cronus-kernel
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cronus-kernel
      - name: Install
        run: bun install --frozen-lockfile || bun install --frozen-lockfile
      - name: Build kernel
        working-directory: cronus-kernel
        run: cargo build
      - name: Build www (+ audit/ui/tokens deps)
        run: bunx turbo build --filter=@cronus-ui/www
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - name: Regenerate audit visual baselines
        env:
          CRONUS_BIN: ${{ github.workspace }}/cronus-kernel/target/debug/cronus
          CRONUS_KERNEL_ROOT: ${{ github.workspace }}/cronus-kernel
        run: bunx playwright test -c playwright.audit.config.ts e2e/audit/parity.visual.spec.ts --update-snapshots
      - name: Upload linux audit baselines
        uses: actions/upload-artifact@v4
        with:
          name: audit-visual-baselines-linux
          path: e2e/audit/__screenshots__/linux
          if-no-files-found: error
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: audit-visual-baselines-linux-report
          path: |
            test-results
            playwright-report/audit
          if-no-files-found: ignore
